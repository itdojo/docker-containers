#                                                                                    🔌 USB CAMERAS
# ⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼
  # MediaMTX runs ffmpeg on demand to pull from /dev/video0 and
  # publish back into the path.  Adjust the device node and encode
  # settings for your camera.  Uncomment ONE of the two variants below.
  # Name below is how you reference camera (Ex: http://dojocam.local:8889/usb)
  # If you have more than one camera, give each a unique name (Ex: usb1, usb2)
  #
  # FIRST, find out what your camera can actually emit. This decides which
  # variant you want, and it is not a detail — it is the difference between
  # no encoding at all and a full software encode:
  #
  #   v4l2-ctl --device=/dev/video0 --list-formats-ext
  #
  # Look for H264 (best), then MJPG (good), then YUYV (worst). Most Logitech
  # business webcams — C920, C922, C925e — do H.264 on the camera itself.
  #
  # `-input_format` is what selects among them. WITHOUT it ffmpeg takes the
  # driver's default, which is almost always raw YUYV: uncompressed frames
  # that saturate USB 2.0 bandwidth (720p often caps near 10fps) and then
  # still have to be encoded from scratch. Omitting that one flag is the
  # single most expensive mistake available on this page.

  # ── Variant A · camera encodes H.264 itself — NO ENCODING ON THE PI ──────
  # `-c:v copy` passes the camera's own H.264 through untouched. Costs
  # essentially nothing, which makes it the only sensible choice on a Pi 5.
  # Set the camera's own keyframe interval if it exposes one; ffmpeg cannot
  # change it here without re-encoding, which would defeat the point.
  #usb:
  #  runOnDemand: >
  #    ffmpeg -f v4l2 -input_format h264 -framerate 30 -video_size 1280x720
  #    -i /dev/video0
  #    -c:v copy -an
  #    -f rtsp rtsp://localhost:8554/$MTX_PATH
  #  runOnDemandRestart: yes
  #  runOnDemandStartTimeout: 10s
  #  runOnDemandCloseAfter: 10s

  # ── Variant B · camera emits MJPEG — decode, then encode ────────────────
  # For cameras with no onboard H.264. The MJPEG decode is cheap; the H.264
  # encode is software on a Pi 5 and hardware on a Pi 4. Drop to 15fps when
  # this feeds Frigate — see FEEDING FRIGATE above.
  #
  # A and B define the SAME path name. Uncommenting both leaves two `usb:`
  # keys in one mapping; one of them silently wins. Pick one.
  #usb:
  #  runOnDemand: >
  #    ffmpeg -f v4l2 -input_format mjpeg -framerate 30 -video_size 1280x720
  #    -i /dev/video0
  #    -c:v libx264 -preset ultrafast -tune zerolatency
  #    -b:v 2500k -g 60 -an
  #    -f rtsp rtsp://localhost:8554/$MTX_PATH
  #  runOnDemandRestart: yes
  #  runOnDemandStartTimeout: 10s
  #  runOnDemandCloseAfter: 10s

