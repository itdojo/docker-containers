###############################################
# MediaMTX on the Pi
#
# Runs on a Raspberry Pi with one CSI or USB camera
# attached.  MediaMTX owns the camera (`source: rpiCamera`
# for CSI; a `runOnDemand` ffmpeg pipeline for USB) and
# publishes RTSP, HLS, and WebRTC on the Pi's LAN
# interface via host networking.
###############################################

services:
  mediamtx:
    container_name: mediamtx
    image: bluenviron/mediamtx:latest-ffmpeg    
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    # Required for `source: rpiCamera` — MediaMTX needs access
    # to the GPU / camera firmware via /dev/vchiq, /dev/dma_heap,
    # and the V4L2 nodes managed by libcamera.
    privileged: true
    tmpfs:
      - /dev/shm:exec
    volumes:
      - /run/udev:/run/udev:ro
      - ./config/mediamtx.yml:/mediamtx.yml:rw
      - ./log/mediamtx.log:/mediamtx.log:rw
      - ./recordings:/recordings
    environment:
      - MTX_WEBRTCADDITIONALHOSTS=${MTX_WEBRTCADDITIONALHOSTS}
      - MTX_LOGFILE=/mediamtx.log
