services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York}
      - PLEX_UID=${PLEX_UID:-1000}
      - PLEX_GID=${PLEX_GID:-1000}
    volumes:
      - ./config:/config
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media:ro
      - ./tv:/tv:ro
