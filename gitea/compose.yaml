
networks:
  gitea:
    external: false

services:
  server:
    image: gitea/gitea:latest
    container_name: gitea
    environment:
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is unset — copy .env.example to .env}
    restart: always
    networks:
      - gitea
    volumes:
      - ./gitea-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_WEB_PORT:-4000}:3000"
      - "${GITEA_SSH_PORT:-222}:22"
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      # Same variable as GITEA__database__PASSWD above — they cannot drift.
      - POSTGRES_USER=${GITEA_DB_USER:-gitea}
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD:?GITEA_DB_PASSWORD is unset — copy .env.example to .env}
      - POSTGRES_DB=${GITEA_DB_NAME:-gitea}
    networks:
      - gitea
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
