# 🧿 DETECTOR OVERLAY — OPENVINO (INTEL) 🧿
# •••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••

# Intel iGPU or NPU. LattePanda Delta and Sigma, and any other x86 host with
# Intel graphics. Fast, and no dongle to lose.
#
#   COMPOSE_FILE=compose.yaml:compose.ports.yaml:compose.openvino.yaml
#
# Pair with the `ov` detector block in config/config.yml — it is the one left
# uncommented in config.yml.example.
#
# This overlay does NOT work on Raspberry Pi or Gateworks. Those are arm64 and
# have no Intel graphics; use compose.coral-usb.yaml or compose.cpu.yaml.

# ⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼
#                                                                                        🐳 FRIGATE
# ⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼⎼
services:
  frigate:
    devices:
      # The render node. Serves BOTH OpenVINO detection and VAAPI video
      # decoding, which is why this profile needs no separate decode overlay.
      # Confirm the number — a host with two GPUs may expose renderD129.
      #   ls -l /dev/dri/
      - /dev/dri/renderD128:/dev/dri/renderD128

      # LattePanda Sigma and other Meteor Lake / Core Ultra parts also expose a
      # dedicated NPU here. Uncomment this AND set `device: NPU` in the ov
      # detector block to use it instead of the iGPU.
      #- /dev/accel/accel0:/dev/accel/accel0

    # The container user must be in the host's `render` group to open the node.
    # The name does not resolve across the boundary, so this has to be the
    # host's NUMERIC render GID:
    #   getent group render | cut -d: -f3
    #
    # There is deliberately no default. The GID is not stable across distros —
    # Debian 12 lands near 104-106, Ubuntu 22.04 near 110, Ubuntu 24.04 at 993
    # because systemd allocates it downward from 999 — so any baked-in number
    # is wrong on most hosts, and wrong silently: the container starts, VAAPI
    # and the GPU stats fail with permission errors that name a group, not a
    # GID. A missing value is a loud compose error instead. frigate-setup.sh
    # fills it in automatically.
    group_add:
      - "${RENDER_GID:?RENDER_GID is not set. Run ./frigate-setup.sh, or set it by hand from: getent group render | cut -d: -f3}"
